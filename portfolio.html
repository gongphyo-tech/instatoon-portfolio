<!doctype html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>그리고툰 포트폴리오로 이동 중…</title>
<!--
  예전 상세 포트폴리오 주소예요. 이제 모든 내용이 메인 페이지 하나로 합쳐져서,
  이 주소로 들어오면 새 메인 페이지의 같은 내용 위치로 자동 이동해요. (고칠 필요 없어요)
-->
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://instatoon-portfolio.vercel.app/">
<meta http-equiv="refresh" content="0; url=./#about">
<script>
  (function () {
    var 연결 = { "소개": "about", "도달률": "stats", "인사이트": "insights", "프로젝트": "projects" };
    var 해시 = decodeURIComponent(location.hash.slice(1));
    location.replace("./#" + (연결[해시] || "about"));
  })();
</script>
<style>body{font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;background:#FFF4E9;color:#605550;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center}a{color:#B9504C}</style>
</head>
<body>
  <p>그리고툰 포트폴리오가 한 페이지로 새로워졌어요.<br><a href="./">새 포트폴리오로 이동하기</a></p>
</body>
</html>
